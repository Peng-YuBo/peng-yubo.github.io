project:
  type: website
  output-dir: docs
  resources:
    - CV.pdf
  
website:
  page-navigation: true
  title: "Peng Yubo 彭育博"
  site-url: https://peng-yubo.github.io
  favicon: images/site-logo.png
  repo-url: https://github.com/Peng-YuBo/peng-yubo.github.io
  repo-actions: [edit, issue]
  
  page-footer:
    left: |
      [peng-yubo.github.io](https://peng-yubo.github.io)<br>
    right: |
      Made with [Quarto](https://quarto.org/)<br>
    
  navbar: 
    background: "#A9CCE3"
    search: false
    right: 
      - text: "Home"
        href: index.qmd
      - text: "Thoughts"
        href: Thoughts.qmd
      - text: "CV"
        href: CV.pdf

format:
  html:
    theme: styles.scss
    css: untappd.css
    include-after-body: cloudflare-analytics.html
    toc: true            # 启用目录
    toc-position: right  # 将目录放置在页面的右侧
    toc-depth: 3         # 设置目录的深度，数字越大，目录越详细
